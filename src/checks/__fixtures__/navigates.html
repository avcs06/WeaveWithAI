<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moves</title>
<style>
  body { margin: 0; background: #ffffff; color: #18181b; font: 16px/1.5 system-ui, sans-serif; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 24px 16px; }
  button { min-width: 44px; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 6px; background: #3d63b8; color: #ffffff; font: inherit; }
  :focus-visible { outline: 3px solid #18181b; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Buttons that open another page</h1>
  <!-- One leaves at once, as a link-like action; one after a wait, as a create that opens what it made; one stays. -->
  <button type="button" data-testid="now" onclick="location.assign('clean.html')">Open now</button>
  <button type="button" data-testid="later" onclick="setTimeout(() => location.assign('clean.html'), 400)">Open after saving</button>
  <button type="button" data-testid="stay" onclick="this.dataset.pressed = '1'">Stay</button>
</main>
</body>
</html>
